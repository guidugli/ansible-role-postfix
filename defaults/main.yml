---
# defaults file for postfix

# Interface addresses that can receive email. The secure default keeps Postfix
# bound to loopback only unless the caller explicitly opens the listener.
pf_inet_interfaces: loopback-only

# Optional relay/SASL settings. Leave undefined to preserve the existing system configuration.
