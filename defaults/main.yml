# pf_smtp_sasl_password_maps: hash:/etc/postfix/sasl/sasl_passwd
# pf_smtpd_sender_login_maps: hash:/etc/postfix/smtpd_sender_login_maps
# pf_smtp_tls_security_level: encrypt
