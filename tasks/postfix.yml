---
- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto
  tags:
    - postfix
    - validate

- name: Remove conflicting packages
  ansible.builtin.package:
    name: "{{ pf_conflicting }}"
    state: absent
  when: "'sendmail' in ansible_facts['packages']"
  tags:
    - postfix
    - install

- name: Ensure Postfix packages are installed
  ansible.builtin.package:
    name: "{{ pf_packages }}"
    update_cache: true
    state: present
  tags:
    - postfix
    - install

- name: Ensure Postfix service is enabled when systemd is active
  ansible.builtin.service:
    name: "{{ pf_service_name }}"
    enabled: true
  when: ansible_facts['service_mgr'] == 'systemd'
  tags:
    - postfix
    - service

- name: Read current Postfix inet_interfaces value
  ansible.builtin.command:
    argv:
      - postconf
      - -h
      - inet_interfaces
  register: postfix_current_inet_interfaces
  changed_when: false
  when: pf_inet_interfaces is defined
  tags:
    - postfix
    - config

- name: Set Postfix inet_interfaces value
  ansible.builtin.command:
    argv:
      - postconf
      - -e
      - "inet_interfaces={{ pf_inet_interfaces }}"
  when:
    - pf_inet_interfaces is defined
    - postfix_current_inet_interfaces.stdout | trim != pf_inet_interfaces | string
  changed_when: true
  notify: Restart postfix
  tags:
    - postfix
    - config

- name: Read current Postfix inet_protocols value
  ansible.builtin.command:
    argv:
      - postconf
      - -h
      - inet_protocols
  register: postfix_current_inet_protocols
  changed_when: false
  when: pf_inet_protocols is defined
  tags:
    - postfix
    - config

- name: Set Postfix inet_protocols value
  ansible.builtin.command:
    argv:
      - postconf
      - -e
      - "inet_protocols={{ pf_inet_protocols }}"
  when:
    - pf_inet_protocols is defined
    - postfix_current_inet_protocols.stdout | trim != pf_inet_protocols | string
  changed_when: true
  notify: Restart postfix
  tags:
    - postfix
    - config

- name: Read current Postfix string and integer option values
  ansible.builtin.command:
    argv:
      - postconf
      - -h
      - "{{ pf_variable_map[item] }}"
  register: postfix_current_string_options
  changed_when: false
  when: lookup('ansible.builtin.vars', item, default=undef()) is defined
  loop:
    - pf_smtp_tls_security_level
    - pf_smtp_tls_mandatory_ciphers
    - pf_smtp_tls_capath
    - pf_smtp_tls_cafile
    - pf_mynetworks
    - pf_mydomain
    - pf_smtpd_tls_loglevel
    - pf_smtp_tls_loglevel
    - pf_smtp_sasl_password_maps
    - pf_smtpd_sender_login_maps
  tags:
    - postfix
    - config

- name: Set Postfix string and integer option values
  ansible.builtin.command:
    argv:
      - postconf
      - -e
      - "{{ pf_variable_map[item.item] }}={{ lookup('ansible.builtin.vars', item.item) }}"
  when:
    - not item.skipped | default(false)
    - item.stdout | trim != lookup('ansible.builtin.vars', item.item) | string
  loop: "{{ postfix_current_string_options.results }}"
  changed_when: true
  notify: Restart postfix
  tags:
    - postfix
    - config

- name: Read current Postfix relayhost value
  ansible.builtin.command:
    argv:
      - postconf
      - -h
      - relayhost
  register: postfix_current_relayhost
  changed_when: false
  when:
    - pf_smtp_server is defined
    - pf_smtp_server_port is defined
  tags:
    - postfix
    - config

- name: Set Postfix relayhost
  ansible.builtin.command:
    argv:
      - postconf
      - -e
      - "relayhost={{ pf_relayhost }}"
  when:
    - pf_smtp_server is defined
    - pf_smtp_server_port is defined
    - postfix_current_relayhost.stdout | trim != pf_relayhost
  changed_when: true
  notify: Restart postfix
  tags:
    - postfix
    - config

- name: Read current Postfix yes/no option values
  ansible.builtin.command:
    argv:
      - postconf
      - -h
      - "{{ pf_variable_map[item] }}"
  register: postfix_current_boolean_options
  changed_when: false
  when: lookup('ansible.builtin.vars', item, default=undef()) is defined
  loop:
    - pf_smtp_sasl_auth_enable
    - pf_disable_vrfy_command
    - pf_smtpd_helo_required
    - pf_strict_rfc821_envelopes
    - pf_smtpd_delay_reject
  tags:
    - postfix
    - config

- name: Set Postfix yes/no option values
  ansible.builtin.command:
    argv:
      - postconf
      - -e
      - "{{ pf_variable_map[item.item] }}={{ postfix_boolean_value }}"
  vars:
    postfix_boolean_value: "{{ 'yes' if lookup('ansible.builtin.vars', item.item) | bool else 'no' }}"
  when:
    - not item.skipped | default(false)
    - item.stdout | trim != postfix_boolean_value
  loop: "{{ postfix_current_boolean_options.results }}"
  changed_when: true
  notify: Restart postfix
  tags:
    - postfix
    - config

- name: Read current Postfix list option values
  ansible.builtin.command:
    argv:
      - postconf
      - -h
      - "{{ pf_variable_map[item] }}"
  register: postfix_current_list_options
  changed_when: false
  when: lookup('ansible.builtin.vars', item, default=undef()) is defined
  loop:
    - pf_smtp_sasl_security_options
    - pf_smtpd_helo_restrictions
    - pf_smtpd_recipient_restrictions
    - pf_smtpd_data_restrictions
  tags:
    - postfix
    - config

- name: Set Postfix list option values
  ansible.builtin.command:
    argv:
      - postconf
      - -e
      - "{{ pf_variable_map[item.item] }}={{ postfix_list_value }}"
  vars:
    postfix_list_value: "{{ lookup('ansible.builtin.vars', item.item) | join(', ') }}"
  when:
    - not item.skipped | default(false)
    - item.stdout | trim != postfix_list_value
  loop: "{{ postfix_current_list_options.results }}"
  changed_when: true
  notify: Restart postfix
  tags:
    - postfix
    - config

- name: Ensure SASL password map directory exists
  ansible.builtin.file:
    path: "{{ pf_sasl_password_map_path | dirname }}"
    state: directory
    owner: "{{ pf_main_cf_owner }}"
    group: "{{ pf_main_cf_group }}"
    mode: '0700'
  vars:
    pf_sasl_password_map_path: "{{ pf_smtp_sasl_password_maps | regex_replace('.*?:', '') }}"
  when:
    - pf_email_address is defined
    - pf_email_password is defined
    - pf_smtp_server is defined
    - pf_smtp_server_port is defined
    - pf_smtp_sasl_password_maps is defined
  tags:
    - postfix
    - config

- name: Create or update Postfix SASL password map file
  ansible.builtin.lineinfile:
    path: "{{ pf_sasl_password_map_path }}"
    regexp: '{{ pf_relayhost | regex_escape }}\\s+{{ pf_email_address | regex_escape }}:'
    line: '{{ pf_relayhost }} {{ pf_email_address }}:{{ pf_email_password }}'
    owner: "{{ pf_main_cf_owner }}"
    group: "{{ pf_main_cf_group }}"
    mode: '0600'
    create: true
    backup: true
  vars:
    pf_sasl_password_map_path: "{{ pf_smtp_sasl_password_maps | regex_replace('.*?:', '') }}"
  when:
    - pf_email_address is defined
    - pf_email_password is defined
    - pf_smtp_server is defined
    - pf_smtp_server_port is defined
    - pf_smtp_sasl_password_maps is defined
  no_log: true
  notify:
    - Run postmap
    - Restart postfix
  tags:
    - postfix
    - config

- name: Validate Postfix configuration
  ansible.builtin.command: postfix check
  changed_when: false
  tags:
    - postfix
    - validate
