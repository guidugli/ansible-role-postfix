---
- name: Build list of defined variables
  ansible.builtin.set_fact:
    postfix_defined_vars: "{{ lookup('ansible.builtin.varnames', '^(pf_).*') }}"
  tags:
    - postfix
    - validate

- name: Check boolean values
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item) is boolean
    quiet: true
    fail_msg: "{{ item }} must be a boolean"
  when:
    - item in postfix_defined_vars
  loop:
    - pf_smtp_sasl_auth_enable
    - pf_disable_vrfy_command
    - pf_smtpd_helo_required
    - pf_strict_rfc821_envelopes
    - pf_smtpd_delay_reject
    - pf_subject_prefix_enabled
  tags:
    - postfix
    - validate

- name: Check string values
  ansible.builtin.assert:
    that:
      - litem is string
      - litem | length > 0
    quiet: true
    fail_msg: "{{ item }} must be a non-empty string"
  vars:
    litem: "{{ lookup('ansible.builtin.vars', item) }}"
  when:
    - item in postfix_defined_vars
  loop:
    - pf_inet_interfaces
    - pf_email_address
    - pf_email_password
    - pf_smtp_server
    - pf_smtp_sasl_password_maps
    - pf_mynetworks
    - pf_smtp_tls_capath
    - pf_smtp_tls_cafile
    - pf_header_checks_path
    - pf_mydomain
    - pf_smtpd_sender_login_maps
    - pf_sender_canonical_maps
    - pf_smtp_generic_maps
    - pf_subject_prefix
  tags:
    - postfix
    - validate

- name: Check list values
  ansible.builtin.assert:
    that:
      - litem is sequence
      - litem is not string
      - litem | length > 0
    quiet: true
    fail_msg: "{{ item }} must be a non-empty list"
  vars:
    litem: "{{ lookup('ansible.builtin.vars', item) }}"
  when:
    - item in postfix_defined_vars
  loop:
    - pf_smtp_sasl_security_options
    - pf_smtpd_helo_restrictions
    - pf_smtpd_recipient_restrictions
    - pf_smtpd_data_restrictions
    - pf_sender_canonical_classes
    - pf_add_sender_canonical
    - pf_remove_sender_canonical
    - pf_add_smtp_generic
    - pf_remove_smtp_generic
  tags:
    - postfix
    - validate

- name: Check pf_smtp_sasl_security_options values
  ansible.builtin.assert:
    that:
      - item is string
      - item in pf_smtp_sasl_security_options_vv
    quiet: true
  when:
    - pf_smtp_sasl_security_options is defined
  loop: "{{ pf_smtp_sasl_security_options }}"
  tags:
    - postfix
    - validate

- name: Check pf_smtp_tls_security_level values
  ansible.builtin.assert:
    that:
      - pf_smtp_tls_security_level is string
      - pf_smtp_tls_security_level in pf_smtp_tls_security_level_vv
    quiet: true
  when:
    - pf_smtp_tls_security_level is defined
  tags:
    - postfix
    - validate

- name: Check pf_smtp_tls_mandatory_ciphers values
  ansible.builtin.assert:
    that:
      - pf_smtp_tls_mandatory_ciphers is string
      - pf_smtp_tls_mandatory_ciphers in pf_smtp_tls_mandatory_ciphers_vv
    quiet: true
  when:
    - pf_smtp_tls_mandatory_ciphers is defined
  tags:
    - postfix
    - validate

- name: Check sender canonical class values
  ansible.builtin.assert:
    that:
      - item is string
      - item in pf_sender_canonical_classes_vv
    quiet: true
    fail_msg: >-
      pf_sender_canonical_classes entries must be envelope_sender or header_sender
  loop: "{{ pf_sender_canonical_classes }}"
  tags:
    - postfix
    - validate

- name: Check sender canonical map entry dictionaries
  ansible.builtin.assert:
    that:
      - item.from is string
      - item.from | length > 0
      - item.to is string
      - item.to | length > 0
    quiet: true
    fail_msg: Each sender canonical entry requires non-empty from and to strings
  loop: "{{ pf_add_sender_canonical | default([], true) }}"
  loop_control:
    label: "{{ item.from | default('invalid entry') }}"
  tags:
    - postfix
    - validate

- name: Check SMTP generic map entry dictionaries
  ansible.builtin.assert:
    that:
      - item.from is string
      - item.from | length > 0
      - item.to is string
      - item.to | length > 0
    quiet: true
    fail_msg: Each SMTP generic entry requires non-empty from and to strings
  loop: "{{ pf_add_smtp_generic | default([], true) }}"
  loop_control:
    label: "{{ item.from | default('invalid entry') }}"
  tags:
    - postfix
    - validate

- name: Determine whether IPv6 is available
  ansible.builtin.set_fact:
    postfix_ipv6_available: >-
      {{
        ansible_facts.interfaces
        | map('extract', ansible_facts)
        | selectattr('ipv6', 'defined')
        | map(attribute='ipv6')
        | flatten
        | length > 0
      }}
  tags:
    - postfix
    - validate

- name: Check pf_inet_protocols values
  ansible.builtin.assert:
    that:
      - pf_inet_protocols is string
      - pf_inet_protocols in pf_inet_protocols_vv
      - postfix_ipv6_available or pf_inet_protocols == 'ipv4'
    quiet: true
  tags:
    - postfix
    - validate

- name: Check integer value variables
  ansible.builtin.assert:
    that:
      - litem | string is match('^[0-9]+$')
      - litem | int >= 0
    quiet: true
    fail_msg: "{{ item }} must be a non-negative integer"
  vars:
    litem: "{{ lookup('ansible.builtin.vars', item) }}"
  when:
    - item in postfix_defined_vars
  loop:
    - pf_smtp_server_port
    - pf_smtpd_tls_loglevel
    - pf_smtp_tls_loglevel
  tags:
    - postfix
    - validate

- name: Check path variables
  ansible.builtin.assert:
    that:
      - litem is string
      - litem | length > 0
      - litem is regex(pathre)
    quiet: true
    fail_msg: "{{ item }} must be an absolute path"
  vars:
    pathre: '^/'
    litem: "{{ lookup('ansible.builtin.vars', item) }}"
  when:
    - item in postfix_defined_vars
  loop:
    - pf_smtp_tls_capath
    - pf_smtp_tls_cafile
  tags:
    - postfix
    - validate
