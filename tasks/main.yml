---
# tasks file for postfix

- name: Include variable validation tasks
  ansible.builtin.include_tasks: assert.yml
  tags:
    - postfix
    - validate

- name: Include Postfix installation and configuration tasks
  ansible.builtin.include_tasks: postfix.yml
  tags:
    - postfix
    - install
    - config
    - service
    - validate

- name: Include Postfix address map management tasks
  ansible.builtin.include_tasks: maps.yml
  tags:
    - postfix
    - config

- name: Include Postfix subject prefix tasks
  ansible.builtin.include_tasks: header_checks.yml
  when: pf_subject_prefix_enabled | bool
  tags:
    - postfix
    - config
    - validate

- name: Include aliases management tasks
  ansible.builtin.include_tasks: aliases.yml
  tags:
    - postfix
    - config
