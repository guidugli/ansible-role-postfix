---
- name: Verify postfix role
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather package facts for verification
      ansible.builtin.package_facts:
        manager: auto
      tags:
        - postfix
        - validate

    - name: Verify Postfix package is installed
      ansible.builtin.assert:
        that:
          - "'postfix' in ansible_facts['packages']"
        quiet: true
      tags:
        - postfix
        - validate

    - name: Stat Postfix main.cf
      ansible.builtin.stat:
        path: /etc/postfix/main.cf
      register: postfix_main_cf
      tags:
        - postfix
        - validate

    - name: Verify Postfix main.cf exists
      ansible.builtin.assert:
        that:
          - postfix_main_cf.stat.exists
        quiet: true
      tags:
        - postfix
        - validate

    - name: Read effective Postfix inet_interfaces value
      ansible.builtin.command:
        argv:
          - postconf
          - -h
          - inet_interfaces
      register: postfix_inet_interfaces
      changed_when: false
      tags:
        - postfix
        - validate

    - name: Read effective Postfix inet_protocols value
      ansible.builtin.command:
        argv:
          - postconf
          - -h
          - inet_protocols
      register: postfix_inet_protocols
      changed_when: false
      tags:
        - postfix
        - validate

    - name: Verify key Postfix settings
      ansible.builtin.assert:
        that:
          - postfix_inet_interfaces.stdout | trim == 'loopback-only'
          - postfix_inet_protocols.stdout | trim == 'ipv4'
        fail_msg: >-
          Unexpected Postfix settings. inet_interfaces={{ postfix_inet_interfaces.stdout | trim }};
          inet_protocols={{ postfix_inet_protocols.stdout | trim }}.
        quiet: true
      tags:
        - postfix
        - validate

    - name: Verify sender canonical and SMTP generic maps
      ansible.builtin.command:
        argv:
          - postmap
          - -q
          - root@localhost
          - "{{ item.map }}"
      loop:
        - map: hash:/etc/postfix/sender_canonical
          expected: canonical@example.com
        - map: hash:/etc/postfix/generic
          expected: generic@example.com
      register: postfix_address_map_queries
      changed_when: false
      failed_when: item.expected not in postfix_address_map_queries.stdout
      tags:
        - postfix
        - validate

    - name: Read configured Postfix address map settings
      ansible.builtin.command:
        argv:
          - postconf
          - -h
          - "{{ item.option }}"
      loop:
        - option: sender_canonical_maps
          expected: hash:/etc/postfix/sender_canonical
        - option: sender_canonical_classes
          expected: envelope_sender
        - option: smtp_generic_maps
          expected: hash:/etc/postfix/generic
      register: postfix_address_map_options
      changed_when: false
      failed_when: postfix_address_map_options.stdout | trim != item.expected
      tags:
        - postfix
        - validate

    - name: Read configured Postfix header_checks value
      ansible.builtin.command:
        argv:
          - postconf
          - -h
          - header_checks
      register: postfix_header_checks
      changed_when: false
      tags:
        - postfix
        - validate

    - name: Verify Postfix subject prefix configuration
      ansible.builtin.assert:
        that:
          - postfix_header_checks.stdout | trim == 'regexp:/etc/postfix/header_checks'
        quiet: true
      tags:
        - postfix
        - validate

    - name: Test Postfix subject prefix regexp rule
      ansible.builtin.command:
        argv:
          - postmap
          - -hmq
          - '-'
          - regexp:/etc/postfix/header_checks
        stdin: |
          Subject: Molecule verification
      register: postfix_subject_prefix_test
      changed_when: false
      failed_when: >-
        'REPLACE Subject: [' ~ ansible_facts['hostname'] ~ '] Molecule verification'
        not in postfix_subject_prefix_test.stdout
      tags:
        - postfix
        - validate

    - name: Verify already prefixed subjects are not modified again
      ansible.builtin.command:
        argv:
          - postmap
          - -hmq
          - '-'
          - regexp:/etc/postfix/header_checks
        stdin: |
          Subject: [{{ ansible_facts['hostname'] }}] Existing prefix
      register: postfix_subject_prefix_duplicate_test
      changed_when: false
      failed_when: "'DUNNO' not in postfix_subject_prefix_duplicate_test.stdout"
      tags:
        - postfix
        - validate
